name: Build C++ Engine for Linux

on:
  push:
    branches:
      - main
    paths:
      - 'Agents/engine/**'
      - 'Agents/engine.cpp'
      - '.github/workflows/build-engine.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++

      - name: Build C++ engine for Linux
        run: |
          cd Agents
          g++ -std=c++20 -O3 -shared -fPIC engine.cpp -o _engine.so

      - name: Verify ELF header
        run: |
          file Agents/_engine.so
          ldd Agents/_engine.so || echo "ldd check skipped (some symbols may be unresolved)"

      - name: Commit and push _engine.so if changed
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add Agents/_engine.so
          if git diff --cached --quiet; then
            echo "No changes to _engine.so"
          else
            git commit -m "Build: Update _engine.so for Linux [automated]"
            git push
          fi
