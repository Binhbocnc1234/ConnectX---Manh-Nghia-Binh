name: Build C++ Engine for Linux

on:
  push:
    branches:
      - main
    paths:
      - 'Agents/engine/**'
      - 'Agents/engine.cpp'
      - '.github/workflows/build-engine.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++

      - name: Build C++ engine for Linux
        run: |
          cd Agents
          g++ -std=c++20 -O3 -shared -fPIC -static-libstdc++ -static-libgcc engine.cpp -o _engine.so

      - name: Verify ELF header
        run: |
          file Agents/_engine.so
          ldd Agents/_engine.so || echo "ldd check skipped (some symbols may be unresolved)"

      - name: Upload _engine.so as artifact
        uses: actions/upload-artifact@v3
        with:
          name: _engine.so
          path: Agents/_engine.so
          if-no-files-found: error

      - name: Check if changed
        id: check_changed
        run: |
          git add Agents/_engine.so
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Notify - Download from Actions tab
        if: steps.check_changed.outputs.changed == 'true'
        run: |
          echo "✅ _engine.so built successfully!"
          echo "📥 Download from Actions tab → this workflow → Artifacts"
          echo "📝 Then commit manually: git add Agents/_engine.so && git commit -m 'Build: _engine.so for Linux'"
